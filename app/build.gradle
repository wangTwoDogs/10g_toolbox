plugins {
    id 'com.android.application'
}

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('signing.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseProperties.getProperty(it)?.trim()
}

android {
    namespace 'com.ergoushushu.toolbox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ergoushushu.toolbox'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

tasks.configureEach {
    if (name == 'validateSigningRelease') {
        doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Release signing is missing. Configure local signing.properties before building a release.')
            }
        }
    }
    if (name == 'packageRelease') {
        doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Refusing to package an unsigned release. Configure local signing.properties.')
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
